<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayFootball League & Standings</title>
    <style>
        :root {
            --primary-bg: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #00e676;
            --text-color: #ffffff;
            --text-muted: #b0b0b0;
            --border-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1, h2 {
            text-align: center;
            color: var(--accent-color);
        }

        /* Auth Bar */
        .auth-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
        }

        .auth-status {
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .auth-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .auth-tabs button {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 4px;
        }

        .auth-tabs button.active-tab {
            background-color: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
            font-weight: bold;
        }

        form {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        input, select, button {
            padding: 10px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background-color: #2a2a2a;
            color: var(--text-color);
        }

        button.action-btn {
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }

        button.action-btn:hover {
            opacity: 0.9;
        }

        /* Tables */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #252525;
            color: var(--accent-color);
        }

        /* Fixtures Grid */
        .fixtures-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .matchday-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            border: 1px solid var(--border-color);
        }

        .matchday-title {
            color: var(--accent-color);
            font-weight: bold;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .match-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .match-teams {
            font-size: 0.9em;
            flex: 1;
        }

        .score-inputs {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .score-inputs input {
            width: 35px;
            text-align: center;
            padding: 5px;
        }

        .badge {
            font-size: 0.75em;
            padding: 2px 6px;
            border-radius: 4px;
            background-color: #333;
            color: var(--text-muted);
            margin-left: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>PlayFootball PlayStation League</h1>

    <!-- Authentication Bar -->
    <div class="auth-card">
        <div id="user-status" class="auth-status">Status: <strong>Viewer Mode (Read Only)</strong></div>
       
        <div id="auth-controls">
            <div class="auth-tabs">
                <button id="tab-login" class="active-tab" onclick="switchAuthTab('login')">Log In</button>
                <button id="tab-signup" onclick="switchAuthTab('signup')">Sign Up</button>
            </div>

            <!-- Login Form -->
            <form id="login-form">
                <input type="email" id="login-email" placeholder="Email" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit" class="action-btn">Log In</button>
            </form>

            <!-- Sign Up Form -->
            <form id="signup-form" style="display: none;">
                <input type="text" id="signup-name" placeholder="Player Name" required>
                <input type="email" id="signup-email" placeholder="Email" required>
                <input type="password" id="signup-password" placeholder="Password (min 6 chars)" minlength="6" required>
                <select id="signup-gender" required>
                    <option value="" disabled selected>Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
                <button type="submit" class="action-btn">Create Account</button>
            </form>
        </div>

        <div id="logout-controls" style="display: none; text-align: center;">
            <button onclick="handleLogout()" class="action-btn">Log Out</button>
        </div>
    </div>

    <!-- Standings Sections -->
    <h2>Overall Player Leaderboard</h2>
    <table>
        <thead>
            <tr>
                <th>Rank</th>
                <th>Player</th>
                <th>Teams</th>
                <th>P</th>
                <th>W</th>
                <th>D</th>
                <th>L</th>
                <th>GF</th>
                <th>GA</th>
                <th>GD</th>
                <th>Pts</th>
            </tr>
        </thead>
        <tbody id="player-leaderboard"></tbody>
    </table>

    <h2>Team Standings</h2>
    <table>
        <thead>
            <tr>
                <th>Pos</th>
                <th>Team</th>
                <th>Player</th>
                <th>P</th>
                <th>W</th>
                <th>D</th>
                <th>L</th>
                <th>GF</th>
                <th>GA</th>
                <th>GD</th>
                <th>Pts</th>
            </tr>
        </thead>
        <tbody id="team-standings"></tbody>
    </table>

    <!-- Fixtures Section -->
    <h2>Fixtures & Results</h2>
    <div id="fixtures-container" class="fixtures-grid"></div>
</div>

<!-- Firebase SDKs -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
        getAuth,
        createUserWithEmailAndPassword,
        signInWithEmailAndPassword,
        signOut,
        onAuthStateChanged,
        updateProfile
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import {
        getDatabase,
        ref,
        set,
        onValue
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // 1. Firebase Configuration (Replace with your own Firebase Console details)
    const firebaseConfig = {
        apiKey: "AIzaSyrpuCl0cPR1o7iKpX0bnjLDgnJnXPxe4",
        authDomain: "playfootball-130f9.firebaseapp.com",
        projectId: "playfootball-130f9",
        storageBucket: "playfootball-130f9.appspot.com",
        messagingSenderId: "892703395345",
        appId:"1:892703395345:web:052f92885fbce97d6e2bb0",
        databaseURL: "https://playfootball-130f9-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // Initial League Setup
    const teams = [
        { id: "LIV", name: "Liverpool", player: "Player 1" },
        { id: "RMA", name: "Real Madrid", player: "Player 1" },
        { id: "MUN", name: "Man United", player: "Player 2" },
        { id: "BAR", name: "FC Barcelona", player: "Player 2" },
        { id: "ARS", name: "Arsenal", player: "Player 3" },
        { id: "INT", name: "Inter Milan", player: "Player 3" }
    ];

    const fixtures = [
        // First Leg (Matchdays 1 - 5)
        { id: "m1", md: 1, home: "LIV", away: "MUN" },
        { id: "m2", md: 1, home: "ARS", away: "BAR" },
        { id: "m3", md: 1, home: "RMA", away: "INT" },

        { id: "m4", md: 2, home: "MUN", away: "ARS" },
        { id: "m5", md: 2, home: "BAR", away: "RMA" },
        { id: "m6", md: 2, home: "INT", away: "LIV" },

        { id: "m7", md: 3, home: "LIV", away: "BAR" },
        { id: "m8", md: 3, home: "MUN", away: "RMA" },
        { id: "m9", md: 3, home: "ARS", away: "INT" },

        { id: "m10", md: 4, home: "RMA", away: "LIV" },
        { id: "m11", md: 4, home: "INT", away: "BAR" },
        { id: "m12", md: 4, home: "ARS", away: "MUN" },

        { id: "m13", md: 5, home: "LIV", away: "INT" },
        { id: "m14", md: 5, home: "MUN", away: "BAR" },
        { id: "m15", md: 5, home: "RMA", away: "ARS" },

        // Second Leg (Matchdays 6 - 10)
        { id: "m16", md: 6, home: "MUN", away: "LIV" },
        { id: "m17", md: 6, home: "BAR", away: "ARS" },
        { id: "m18", md: 6, home: "INT", away: "RMA" },

        { id: "m19", md: 7, home: "ARS", away: "MUN" },
        { id: "m20", md: 7, home: "RMA", away: "BAR" },
        { id: "m21", md: 7, home: "LIV", away: "INT" },

        { id: "m22", md: 8, home: "BAR", away: "LIV" },
        { id: "m23", md: 8, home: "RMA", away: "MUN" },
        { id: "m24", md: 8, home: "INT", away: "ARS" },

        { id: "m25", md: 9, home: "LIV", away: "RMA" },
        { id: "m26", md: 9, home: "BAR", away: "INT" },
        { id: "m27", md: 9, home: "MUN", away: "ARS" },

        { id: "m28", md: 10, home: "INT", away: "LIV" },
        { id: "m29", md: 10, home: "BAR", away: "MUN" },
        { id: "m30", md: 10, home: "ARS", away: "RMA" }
    ];

    let matchScores = {};
    let isUserLoggedIn = false;

    // Listen to Firebase Auth state
    onAuthStateChanged(auth, (user) => {
        if (user) {
            isUserLoggedIn = true;
            document.getElementById('user-status').innerHTML = `Logged in as: <strong>${user.displayName || user.email}</strong>`;
            document.getElementById('auth-controls').style.display = 'none';
            document.getElementById('logout-controls').style.display = 'block';
        } else {
            isUserLoggedIn = false;
            document.getElementById('user-status').innerHTML = `Status: <strong>Viewer Mode (Read Only)</strong>`;
            document.getElementById('auth-controls').style.display = 'block';
            document.getElementById('logout-controls').style.display = 'none';
        }
        renderFixtures();
    });

    // Listen to Realtime Database updates from Firestore
    onSnapshot(doc(db, "league", "scores"), (docSnapshot) => {
        if (docSnapshot.exists()) {
            matchScores = docSnapshot.data();
            renderFixtures();
            calculateAndRenderTables();
        } else {
            calculateAndRenderTables();
        }
    });

    // Handle Authentication Forms
    window.switchAuthTab = function(mode) {
        if (mode === 'login') {
            document.getElementById('login-form').style.display = 'flex';
            document.getElementById('signup-form').style.display = 'none';
            document.getElementById('tab-login').classList.add('active-tab');
            document.getElementById('tab-signup').classList.remove('active-tab');
        } else {
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('signup-form').style.display = 'flex';
            document.getElementById('tab-signup').classList.add('active-tab');
            document.getElementById('tab-login').classList.remove('active-tab');
        }
    };

    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        try {
            await signInWithEmailAndPassword(auth, email, password);
        } catch (err) {
            alert("Login Failed: " + err.message);
        }
    });

    document.getElementById('signup-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('signup-name').value;
        const email = document.getElementById('signup-email').value;
        const password = document.getElementById('signup-password').value;
        try {
            const userCred = await createUserWithEmailAndPassword(auth, email, password);
            await updateProfile(userCred.user, { displayName: name });
        } catch (err) {
            alert("Sign Up Failed: " + err.message);
        }
    });

    window.handleLogout = async function() {
        await signOut(auth);
    };

    // Render Fixtures Inputs
    function renderFixtures() {
        const container = document.getElementById('fixtures-container');
        container.innerHTML = '';

        for (let md = 1; md <= 10; md++) {
            const mdMatches = fixtures.filter(m => m.md === md);
            let mdHTML = `<div class="matchday-card"><div class="matchday-title">Matchday ${md}</div>`;

            mdMatches.forEach(match => {
                const homeTeam = teams.find(t => t.id === match.home);
                const awayTeam = teams.find(t => t.id === match.away);
                const score = matchScores[match.id] || { home: '', away: '' };

                mdHTML += `
                    <div class="match-row">
                        <div class="match-teams">
                            <strong>${homeTeam.name}</strong> vs <strong>${awayTeam.name}</strong>
                        </div>
                        <div class="score-inputs">
                            <input type="number" min="0" value="${score.home}"
                                ${!isUserLoggedIn ? 'disabled' : ''}
                                onchange="saveScore('${match.id}', 'home', this.value)">
                            :
                            <input type="number" min="0" value="${score.away}"
                                ${!isUserLoggedIn ? 'disabled' : ''}
                                onchange="saveScore('${match.id}', 'away', this.value)">
                        </div>
                    </div>
                `;
            });

            mdHTML += `</div>`;
            container.innerHTML += mdHTML;
        }
    }

    // Save Score to Firestore
    window.saveScore = async function(matchId, side, value) {
        if (!matchScores[matchId]) {
            matchScores[matchId] = { home: '', away: '' };
        }
        matchScores[matchId][side] = value === '' ? '' : parseInt(value, 10);

        try {
            await setDoc(doc(db, "league", "scores"), matchScores, { merge: true });
        } catch (err) {
            console.error("Error saving score: ", err);
        }
    };

    // Calculate Points, GD, and Rankings
    function calculateAndRenderTables() {
        // Initialize Team Stats
        const teamStats = {};
        teams.forEach(t => {
            teamStats[t.id] = { ...t, P: 0, W: 0, D: 0, L: 0, GF: 0, GA: 0, GD: 0, Pts: 0 };
        });

        // Calculate from Scores
        Object.keys(matchScores).forEach(matchId => {
            const score = matchScores[matchId];
            const match = fixtures.find(m => m.id === matchId);

            if (score && score.home !== '' && score.away !== '' && match) {
                const h = teamStats[match.home];
                const a = teamStats[match.away];
                const hGoals = parseInt(score.home, 10);
                const aGoals = parseInt(score.away, 10);

                if (!isNaN(hGoals) && !isNaN(aGoals)) {
                    h.P++; a.P++;
                    h.GF += hGoals; h.GA += aGoals;
                    a.GF += aGoals; a.GA += hGoals;

                    if (hGoals > aGoals) {
                        h.W++; h.Pts += 3;
                        a.L++;
                    } else if (aGoals > hGoals) {
                        a.W++; a.Pts += 3;
                        h.L++;
                    } else {
                        h.D++; h.Pts += 1;
                        a.D++; a.Pts += 1;
                    }

                    h.GD = h.GF - h.GA;
                    a.GD = a.GF - a.GA;
                }
            }
        });

        // Convert to Array & Sort Teams
        const sortedTeams = Object.values(teamStats).sort((a, b) =>
            b.Pts - a.Pts || b.GD - a.GD || b.GF - a.GF
        );

        // Render Team Standings
        const teamBody = document.getElementById('team-standings');
        teamBody.innerHTML = '';
        sortedTeams.forEach((t, index) => {
            teamBody.innerHTML += `
                <tr>
                    <td>${index + 1}</td>
                    <td><strong>${t.name}</strong></td>
                    <td>${t.player}</td>
                    <td>${t.P}</td>
                    <td>${t.W}</td>
                    <td>${t.D}</td>
                    <td>${t.L}</td>
                    <td>${t.GF}</td>
                    <td>${t.GA}</td>
                    <td>${t.GD}</td>
                    <td><strong>${t.Pts}</strong></td>
                </tr>
            `;
        });

        // Calculate Player Leaderboard
        const playerStats = {};
        ["Player 1", "Player 2", "Player 3"].forEach(p => {
            playerStats[p] = { name: p, teams: [], P: 0, W: 0, D: 0, L: 0, GF: 0, GA: 0, GD: 0, Pts: 0 };
        });

        Object.values(teamStats).forEach(t => {
            const p = playerStats[t.player];
            if (p) {
                p.teams.push(t.name);
                p.P += t.P;
                p.W += t.W;
                p.D += t.D;
                p.L += t.L;
                p.GF += t.GF;
                p.GA += t.GA;
                p.GD += t.GD;
                p.Pts += t.Pts;
            }
        });

        const sortedPlayers = Object.values(playerStats).sort((a, b) =>
            b.Pts - a.Pts || b.GD - a.GD || b.GF - a.GF
        );

        // Render Player Leaderboard
        const playerBody = document.getElementById('player-leaderboard');
        playerBody.innerHTML = '';
        sortedPlayers.forEach((p, index) => {
            playerBody.innerHTML += `
                <tr>
                    <td><strong>${index + 1}</strong></td>
                    <td><strong>${p.name}</strong></td>
                    <td>${p.teams.join(' & ')}</td>
                    <td>${p.P}</td>
                    <td>${p.W}</td>
                    <td>${p.D}</td>
                    <td>${p.L}</td>
                    <td>${p.GF}</td>
                    <td>${p.GA}</td>
                    <td>${p.GD}</td>
                    <td><strong>${p.Pts}</strong></td>
                </tr>
            `;
        });
    }
</script>

</body>
</html>
